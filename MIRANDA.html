<script>(function(){var f=document.getElementById('ltdof-frame'),b=document.getElementById('ltdof-qr-fab'),p=document.getElementById('ltdof-qr-panel'),x=document.getElementById('ltdof-qr-close'),c=document.getElementById('ltdof-qr-canvas'),url=(function(){var u=new URL(location.href);u.searchParams.delete('l');u.searchParams.delete('ltdof_inner');return u.href})(),src="https:\/\/latarjetadigital.com.ar\/wp-content\/plugins\/la-tarjeta-digital-vista-oficial\/ltd-oficial-qr.min.js?ver=3.1.1",loading=false,timer=null;f.src=url;function d(){try{return f.contentDocument}catch(e){return null}}function color(){try{var z=d(),s=z&&getComputedStyle(z.documentElement);return s&&(s.getPropertyValue('--color-texto').trim()||s.getPropertyValue('--color-negro').trim())||'#595959'}catch(e){return'#595959'}}function draw(){if(!window.LTDOfficialQRCode)return;try{var q=new LTDOfficialQRCode(-1,1);q.addData(new URL(url).href);q.make();var n=q.getModuleCount(),g=c.getContext('2d'),size=c.width,quiet=4,cell=size/(n+quiet*2),co=color();p.style.setProperty('--ltdof-qr-color',co);g.imageSmoothingEnabled=false;g.fillStyle='#fff';g.fillRect(0,0,size,size);g.fillStyle=co;for(var r=0;r<n;r++)for(var j=0;j<n;j++)if(q.isDark(r,j))g.fillRect(Math.round((j+quiet)*cell),Math.round((r+quiet)*cell),Math.ceil(cell),Math.ceil(cell));c.hidden=false;document.getElementById('ltdof-qr-status').textContent=''}catch(e){c.hidden=true;document.getElementById('ltdof-qr-status').textContent='El enlace es demasiado largo para generar el QR.'}}function load(){if(window.LTDOfficialQRCode)return draw();if(loading)return;loading=true;var s=document.createElement('script');s.src=src;s.onload=function(){loading=false;draw()};s.onerror=function(){loading=false;c.hidden=true;document.getElementById('ltdof-qr-status').textContent='No se pudo cargar el QR. Cerrá y volvé a abrir.';s.remove()};document.head.appendChild(s)}function open(){clearTimeout(timer);p.hidden=false;b.hidden=true;p.style.setProperty('--ltdof-qr-color',
